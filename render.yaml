services:
  - type: web
    name: toko-web-flask
    runtime: python
    rootDir: toko-web-flask
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TOKO_SECRET_KEY
        generateValue: true
      - key: KASSA
        value: "1"
