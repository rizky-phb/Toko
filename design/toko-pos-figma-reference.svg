<svg xmlns="http://www.w3.org/2000/svg" width="3160" height="1120" viewBox="0 0 3160 1120">
  <defs>
    <style>
      .bg { fill: #d9e8ef; }
      .teal { fill: #048d86; }
      .teal2 { fill: #078981; }
      .teal3 { fill: #0a9f96; }
      .cyan { fill: #2bc2b7; }
      .blue { fill: #071887; }
      .red { fill: #8d0606; }
      .dark { fill: #032c30; }
      .panel { fill: #eafaf6; }
      .field { fill: #eafffb; }
      .line { stroke: #031d1b; stroke-width: 2; }
      .thin { stroke: #064340; stroke-width: 1; }
      .cyan-line { stroke: #3adbd1; stroke-width: 2; }
      .white { fill: #ffffff; }
      .ink { fill: #061313; }
      .muted { fill: #4c6664; }
      .mono { font-family: Consolas, "Courier New", monospace; }
      .label { font-size: 18px; }
      .small { font-size: 15px; }
      .xs { font-size: 13px; }
      .title { font-size: 22px; font-weight: 700; }
      .h1 { font-size: 34px; font-weight: 800; }
      .nav { font-size: 16px; font-weight: 700; }
      .tableh { font-size: 15px; font-weight: 700; }
      .shadow { filter: drop-shadow(8px 8px 0 rgba(0,0,0,.18)); }
    </style>
    <pattern id="old-pos-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="8" height="8" fill="#048d86"/>
      <rect width="1" height="8" fill="#000000" opacity=".09"/>
    </pattern>
